name: Refresh trade scanner

on:
  schedule:
    # All times UTC, Monday to Friday. Both US daylight/standard-time variants are covered.
    - cron: '30 3 * * 1-5'    # 09:00 IST  - India pre-open
    - cron: '50 4 * * 1-5'    # 10:20 IST  - India, opening range is done
    - cron: '30 12 * * 1-5'   # 08:30 EDT / 07:30 EST - US pre-market
    - cron: '20 14 * * 1-5'   # 10:20 EDT - US opening range (summer)
    - cron: '20 15 * * 1-5'   # 10:20 EST - US opening range (winter)
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-scanner
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan the market
        run: node scan.mjs

      - name: Refuse to publish an empty scan
        run: |
          node -e "
          const d = JSON.parse(require('fs').readFileSync('picks.json','utf8'));
          const us = d.picks.filter(p => p.market === 'US').length;
          const inn = d.picks.filter(p => p.market === 'IN').length;
          console.log('picks: US', us, 'IN', inn, 'scanned', d.scanned);
          if (d.scanned < 40) { console.error('Too few charts came back (Yahoo may be blocking). Keeping the old page.'); process.exit(1); }
          "

      - name: Build the page
        run: node build.mjs

      - name: Commit the new page
        run: |
          git config user.name  "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add trade-scanner.html
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Refresh scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
